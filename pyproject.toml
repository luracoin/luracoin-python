[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "luracoin"
version = "0.1.0"
description = "Luracoin Python implementation — an educational cryptocurrency project."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
authors = [{ name = "Marcos Aguayo" }]
keywords = ["cryptocurrency", "blockchain", "luracoin", "educational"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "aiohttp>=3.10,<4",
    "base58>=2.1,<3",
    "coincurve>=21,<22",
    "fastapi>=0.141.1,<0.142",
    "mnemonic>=0.21,<1",
    "redis>=5,<8",
    "rocksdict>=0.3.29,<0.4",
    "uvicorn>=0.39,<0.40",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "build>=1.2,<2",
    "coverage>=7.6,<8",
    "flake8>=7.1,<8",
    "httpx>=0.27,<0.29",
    "isort>=5.13,<7",
    "mypy>=1.13,<2",
    "pip-audit>=2.10,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-mock>=3.14,<4",
    "twine>=6,<7",
]

[project.scripts]
luracoin = "luracoin.cli:cli"

[project.urls]
Repository = "https://github.com/luracoin/luracoin-python"
Changelog = "https://github.com/luracoin/luracoin-python/blob/master/CHANGELOG.md"
Security = "https://github.com/luracoin/luracoin-python/blob/master/SECURITY.md"
Protocol = "https://github.com/luracoin/luracoin-python/blob/master/docs/PROTOCOL.md"

[tool.setuptools.packages.find]
include = ["luracoin*"]
exclude = ["tests*", "docs*", "design*"]

[tool.black]
line-length = 79
target-version = ["py310"]
exclude = '''.git|env/'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
